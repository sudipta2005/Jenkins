<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    :root {
      --navy: #10233f;
      --blue: #3976b9;
      --cream: #f7f4ed;
      --coral: #ef806b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--navy);
      background: var(--cream);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span { color: var(--coral); }

    nav a {
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      margin-left: 24px;
    }

    main {
      max-width: 1100px;
      min-height: calc(100vh - 180px);
      margin: 0 auto;
      padding: 60px 24px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 70px;
    }

    h1 {
      max-width: 650px;
      margin: 0 0 24px;
      font-family: Georgia, serif;
      font-size: clamp(52px, 8vw, 92px);
      line-height: 0.98;
      letter-spacing: -5px;
    }

    h1 em {
      color: var(--blue);
      font-style: italic;
    }

    p {
      max-width: 500px;
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 1.7;
      color: #536178;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 16px 24px;
      background: var(--navy);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(16, 35, 63, 0.18);
    }

    button:hover { background: var(--blue); }

    .art {
      position: relative;
      aspect-ratio: 1;
      border-radius: 50% 50% 42% 58% / 58% 42% 58% 42%;
      background: var(--blue);
      transform: rotate(-5deg);
      overflow: hidden;
    }

    .art::before {
      content: "";
      position: absolute;
      width: 42%;
      height: 42%;
      left: 29%;
      top: 29%;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 130px -85px 0 -45px var(--cream);
    }

    .art::after {
      content: "";
      position: absolute;
      width: 55%;
      height: 18%;
      left: 22%;
      bottom: 14%;
      border-radius: 50%;
      background: var(--navy);
    }

    @media (max-width: 760px) {
      nav a { display: none; }
      main {
        grid-template-columns: 1fr;
        gap: 45px;
        padding-top: 35px;
        text-align: center;
      }
      h1 { letter-spacing: -3px; }
      p { margin-inline: auto; }
      .art { max-width: 320px; width: 80%; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Studio<span>.</span></div>
    <div>
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <main>
    <section>
      <h1>Make ideas <em>happen.</em></h1>
      <p>We turn clear thinking and bold creativity into memorable digital experiences that make people look twice.</p>
      <button type="button" onclick="alert('Hello! Thanks for stopping by.')">Get in touch</button>
    </section>
    <div class="art" aria-label="Abstract colorful design"></div>
  </main>
</body>
</html>
